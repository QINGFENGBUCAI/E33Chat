import groovy.json.JsonSlurper

rootProject.name = 'E33Chat'

def settingsFile = new File(rootDir, 'settings.json')
if (!settingsFile.exists()) {
    throw new GradleException("Missing settings.json: ${settingsFile.absolutePath}")
}

def settings = new JsonSlurper().parse(settingsFile) as Map<String, List<String>>
List<String> versions = settings.get('versions') as List<String>

File mainProjectFile = new File(rootDir, 'versions/mainProject')
if (!mainProjectFile.exists()) {
    throw new GradleException("Missing versions/mainProject file: ${mainProjectFile.absolutePath}")
}

for (String version : versions) {
    File projectDir = new File(rootDir, "versions/${version}")
    if (!projectDir.exists()) {
        logger.warn("Warning: Directory not found for version ${version}: ${projectDir.absolutePath}")
        continue
    }

    include(":${version}")
    ProjectDescriptor proj = project(":${version}")
    proj.setProjectDir(projectDir)

    File versionBuildFile = new File(projectDir, "build.gradle")
    if (versionBuildFile.exists()) {
        println "Registered version: ${version} -> versions/${version} (local build script)"
    } else {
        proj.setBuildFileName("../shared/build.gradle")
        println "Registered version: ${version} -> versions/${version} (shared build script)"
    }
}