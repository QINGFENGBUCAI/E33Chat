name: 功能建议
description: 提出新功能或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前体验中的不便，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的实现方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: input
    id: mc-version
    attributes:
      label: 目标 Minecraft 版本
      placeholder: 1.21.1
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已检索现有 Issue，没有重复建议
          required: true
