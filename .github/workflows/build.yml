# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: setup jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: show build environment
        run: |
          java -version
          ./gradlew --version
      - name: build
        shell: bash
        run: |
          ./gradlew clean build --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          exit ${PIPESTATUS[0]}
      - name: summarize gradle failure
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            python3 - <<'PY'
          from pathlib import Path
          log = Path("gradle-build.log").read_text(errors="replace").splitlines()
          def annotate(title, lines):
              text = "\n".join(lines)
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{text}")
          failure_markers = (
              "FAILURE:",
              "* What went wrong:",
              "Caused by:",
              "Exception",
              "Could not",
              "failed",
              "FAILED",
          )
          important = []
          for i, line in enumerate(log):
              if any(marker in line for marker in failure_markers):
                  start = max(0, i - 6)
                  end = min(len(log), i + 18)
                  important.extend(log[start:end])
                  important.append("")
          if important:
              annotate("Gradle build failed - important lines", important[-180:])
          annotate("Gradle build failed - tail", log[-180:])
          PY
          fi
      - name: generate checksums
        if: success()
        shell: bash
        run: |
          find versions -path '*/build/libs/*.jar' -type f -print0 | sort -z | xargs -0 sha256sum > checksums.sha256
      - name: capture build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Artifacts
          path: |
            versions/*/build/libs/*.jar
            checksums.sha256
