// 共享构建脚本 - 所有版本子项目共用 (MasaGadget 风格)
// 版本特定配置在各自 gradle.properties 中定义
// 26.x 版本自动启用 Yarn→Mojang 映射转换

// 使用 buildscript + apply plugin 方式支持动态 Loom 版本
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://jitpack.io" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("net.fabricmc:fabric-loom:${project.loom_version}")
    }
}

apply plugin: "java"
apply plugin: "fabric-loom"
apply plugin: "maven-publish"

// 从 root gradle.properties 设置 group 和 version
group = rootProject.maven_group
version = rootProject.mod_version

// 使用 project properties 直接配置 (MasaGadget 风格)
println "Building: ${project.name} (MC ${project.minecraft_version}) - loom ${project.loom_version}"
def targetJavaVersion = (project.findProperty('java_version') ?: '21') as Integer
def modmenuVersion = project.findProperty('modmenu_version') ?: '11.0.3'

final int mcVersion = project.mcVersion.toString().toInteger()
// MC 26.x 取消了混淆，使用 Mojang 官方名称，无需 Yarn mappings
def isMinecraft26x = mcVersion >= 26000

// 输出文件名
base.archivesName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.nucleoid.xyz/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (isMinecraft26x) {
        // 26.x: MC 取消混淆，使用空映射文件（含 official 命名空间）满足 Loom 要求
        mappings loom.layered {
            mappings file("${rootProject.projectDir}/versions/shared/empty-mappings.tiny")
        }
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    } else {
        // 1.16.5 ~ 1.21.11: 使用 Yarn mappings + modImplementation
        mappings "net.fabricmc:yarn:${project.minecraft_version}+build.${project.yarn_build}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    // 预处理器模式下 sourcesJar 重映射会失败，由主项目单独构建 sourcesJar
    // CI 统一使用 Java 25 运行 Gradle；旧版本通过 options.release 保持目标字节码，
    // 避免 fresh runner 额外寻找 Java 17/21 toolchain 导致构建失败。
}

// 预处理器子项目禁用 sourcesJar 重映射（预处理指令导致 remapper 崩溃）
// 26.x 无 mappings 时 remapSourcesJar 可能不存在，使用 matching 安全跳过
tasks.matching { it.name == 'remapSourcesJar' }.configureEach {
    enabled = false
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = 'UTF-8'
}

// 读取主项目名称
def mainProjectName = file("${rootProject.projectDir}/versions/mainProject").text.trim()

// 共享源码目录（含预处理指令）
def sharedSrcDir = file("${rootProject.projectDir}/src/main/java")
def sharedResDir = file("${rootProject.projectDir}/src/main/resources")
def versionJavaDir = file("${project.projectDir}/src/main/java")
def versionResDir = file("${project.projectDir}/src/main/resources")
def preprocessedDir = file("${buildDir}/preprocessed/main/java")
def sharedTestDir = file("${rootProject.projectDir}/src/test/java")
def stubOnlySources = (project.findProperty('stub_only_sources') ?: 'false').toString().toBoolean()
// 测试仅在主版本上编译运行（测试文件引用 Minecraft API，旧版本可能不兼容）
def isMainProject = project.name == mainProjectName

// 生成预处理代码的任务：按当前子项目 mcVersion 处理 //#if / //#else / //#endif，
// 并在选中旧版本分支时把 //$$ 代码行恢复为真实 Java 代码。
// MC 26.x 额外执行 Yarn→Mojang 名称映射转换。
abstract class PreprocessTask extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    def File srcDir

    @OutputDirectory
    def File outDir

    @Input
    def int targetMcVersion

    @TaskAction
    def preprocess() {
        outDir.deleteDir()
        srcDir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            if (f.name.endsWith('.java')) {
                def relPath = srcDir.toPath().relativize(f.toPath())
                def outFile = new File(outDir, relPath.toString())
                outFile.parentFile.mkdirs()
                def lines = f.readLines('UTF-8')
                def outLines = []
                def stack = []
                lines.each { line ->
                    def trimmed = line.trim()
                    def matcher = (trimmed =~ /^\/\/#(if|else|endif)\s*(.*)/)
                    if (matcher.matches()) {
                        def directive = matcher.group(1)
                        def expr = matcher.group(2)?.trim()
                        if (directive == 'if') {
                            stack.push(evaluate(expr, targetMcVersion))
                        } else if (directive == 'else') {
                            if (stack) stack.push(!stack.pop())
                        } else if (directive == 'endif') {
                            if (stack) stack.pop()
                        }
                        return
                    }
                    boolean active = true
                    for (def s : stack) {
                        if (!s) { active = false; break }
                    }
                    if (active) {
                        String processed = uncommentPreprocessLine(line)
                        if (targetMcVersion >= 26000) {
                            processed = applyMojangMapping(processed, targetMcVersion)
                            // 26.x input rework: Element overrides take the KeyEvent /
                            // MouseButtonEvent records. The source keeps the flat form and
                            // the body re-extracts the original locals so every existing
                            // reference inside the method keeps working.
                            def ind = '(\\s*)'
                            processed = processed.replaceAll(
                                "(?m)^${ind}public boolean keyPressed\\(int keyCode, int scanCode, int modifiers\\) \\{",
                                '$1public boolean keyPressed(net.minecraft.client.input.KeyEvent keyInput) {\n' +
                                '$1    int keyCode = keyInput.key();\n' +
                                '$1    int scanCode = keyInput.scancode();\n' +
                                '$1    int modifiers = keyInput.modifiers();')
                            // ChatScreen gained a `draft` flag; the source keeps the one-arg form
                            processed = processed.replaceAll("(?m)^(\\s*)super\\(\"\"\\);", '$1super("", false);')
                            processed = processed.replaceAll(
                                "(?m)^${ind}public boolean mouseClicked\\(double mouseX, double mouseY, int button\\) \\{",
                                '$1public boolean mouseClicked(net.minecraft.client.input.MouseButtonEvent clickInput, boolean doubled) {\n' +
                                '$1    double mouseX = clickInput.x();\n' +
                                '$1    double mouseY = clickInput.y();\n' +
                                '$1    int button = clickInput.button();')
                            processed = processed.replaceAll(
                                "(?m)^${ind}public boolean mouseDragged\\(double mouseX, double mouseY, int button, double (\\w+), double (\\w+)\\) \\{",
                                '$1public boolean mouseDragged(net.minecraft.client.input.MouseButtonEvent clickInput, double $2, double $3) {\n' +
                                '$1    double mouseX = clickInput.x();\n' +
                                '$1    double mouseY = clickInput.y();\n' +
                                '$1    int button = clickInput.button();')
                            processed = processed.replaceAll(
                                "(?m)^${ind}public boolean mouseReleased\\(double mouseX, double mouseY, int button\\) \\{",
                                '$1public boolean mouseReleased(net.minecraft.client.input.MouseButtonEvent clickInput) {\n' +
                                '$1    double mouseX = clickInput.x();\n' +
                                '$1    double mouseY = clickInput.y();\n' +
                                '$1    int button = clickInput.button();')
                            processed = processed.replaceAll("super\\.keyPressed\\(keyCode, scanCode, modifiers\\)", "super.keyPressed(keyInput)")
                            processed = processed.replaceAll("super\\.mouseClicked\\(mouseX, mouseY, button\\)", "super.mouseClicked(clickInput, doubled)")
                            processed = processed.replaceAll("super\\.mouseDragged\\(mouseX, mouseY, button, ", "super.mouseDragged(clickInput, ")
                            processed = processed.replaceAll("super\\.mouseReleased\\(mouseX, mouseY, button\\)", "super.mouseReleased(clickInput)")
                            processed = processed.replaceAll("this\\.getFocused\\(\\)\\.keyPressed\\(keyCode, scanCode, modifiers\\)",
                                'this.getFocused().keyPressed(com.niuqu.chatbubble.compat.InputCompat.key(keyCode, scanCode, modifiers))')
                            processed = processed.replaceAll("commandSuggestions\\.keyPressed\\(keyCode, scanCode, modifiers\\)",
                                'commandSuggestions.keyPressed(com.niuqu.chatbubble.compat.InputCompat.key(keyCode, scanCode, modifiers))')
                            processed = processed.replaceAll("commandSuggestions\\.mouseClicked\\(\\(int\\) mouseX, \\(int\\) mouseY, button\\)",
                                'commandSuggestions.mouseClicked(com.niuqu.chatbubble.compat.InputCompat.click(mouseX, mouseY, button))')
                            // widget.onClick(x, y) / widget.mouseClicked(x, y, button)
                            processed = processed.replaceAll(
                                "(\\w+(?:\\.\\w+)*)\\.onClick\\(([^,()]+), ([^,()]+)\\)",
                                'com.niuqu.chatbubble.compat.InputCompat.onClick($1, $2, $3)')
                            processed = processed.replaceAll(
                                "(\\w+(?:\\.\\w+)*)\\.mouseClicked\\(([^,()]+), ([^,()]+), ([^,()]+)\\)",
                                'com.niuqu.chatbubble.compat.InputCompat.mouseClicked($1, $2, $3, $4)')
                            // Screen.hasShiftDown() was removed with the flat input params
                            processed = processed.replaceAll("Screen\\.hasShiftDown\\(\\)",
                                "com.niuqu.chatbubble.compat.InputCompat.hasShiftDown()")
                            // 26.x: KeyMapping.matches 只接受 KeyEvent / InputConstants.Key 了
                            processed = processed.replaceAll(
                                "(\\w+(?:\\.\\w+)*)\\.matches\\(keyCode, scanCode\\)",
                                'com.niuqu.chatbubble.compat.InputCompat.keyMatches($1, keyCode, scanCode)')
                            // 26.x: Screen.handleTextClick(Style) 换成了静态的
                            // defaultHandleClickEvent(ClickEvent, Minecraft, Screen)
                            processed = processed.replaceAll(
                                "\\bhandleTextClick\\(([^()]+)\\)",
                                'defaultHandleClickEvent($1.getClickEvent(), this.minecraft, this)')
                            // Screen.resize/init dropped their leading MinecraftClient parameter
                            processed = processed.replaceAll(
                                "(?m)^(\\s*)public void resize\\(Minecraft \\w+, int (\\w+), int (\\w+)\\) \\{",
                                '$1public void resize(int $2, int $3) {')
                            processed = processed.replaceAll("this\\.init\\(\\w+, (\\w+), (\\w+)\\)", 'this.init($1, $2)')
                        }
                        // Pre-1.19: Text API uses constructors instead of factory methods (Text.literal introduced in 1.19)
                        if (targetMcVersion < 11900 && targetMcVersion < 26000) {
                            processed = processed.replaceAll("net\\.minecraft\\.text\\.Text\\.literal\\(", "new LiteralText(")
                            processed = processed.replaceAll("net\\.minecraft\\.text\\.Text\\.translatable\\(", "new TranslatableText(")
                            processed = processed.replaceAll("net\\.minecraft\\.text\\.Text\\.empty\\(\\)", 'new LiteralText("")')
                            processed = processed.replaceAll("Text\\.literal\\(", "new LiteralText(")
                            processed = processed.replaceAll("Text\\.translatable\\(", "new TranslatableText(")
                            processed = processed.replaceAll("Text\\.empty\\(\\)", 'new LiteralText("")')
                            // Pre-1.19: Style.withObfuscated/withStrikethrough → withFormatting
                            processed = processed.replaceAll("\\.withObfuscated\\(true\\)", ".withFormatting(Formatting.OBFUSCATED)")
                            processed = processed.replaceAll("\\.withObfuscated\\(false\\)", "")
                            processed = processed.replaceAll("\\.withStrikethrough\\(true\\)", ".withFormatting(Formatting.STRIKETHROUGH)")
                            processed = processed.replaceAll("\\.withStrikethrough\\(false\\)", "")
                            // Pre-1.19: fillStyle → setStyle (fillStyle introduced in 1.19)
                            processed = processed.replaceAll("\\.fillStyle\\(", ".setStyle(")
                            // Pre-1.19: networkHandler.sendChatCommand/sendChatMessage → player.sendChatMessage
                            // (ClientPlayNetworkHandler doesn't have these in pre-1.19; PlayerEntity does)
                            processed = processed.replaceAll("(\\w+)\\.player\\.networkHandler\\.sendChatCommand\\(", '$1.player.sendChatMessage("/" + ')
                            processed = processed.replaceAll("(\\w+)\\.player\\.networkHandler\\.sendChatMessage\\(", '$1.player.sendChatMessage(')
                            // Pre-1.19: Identifier.of() → new Identifier()
                            processed = processed.replaceAll("Identifier\\.of\\(", "new Identifier(")
                            // Pre-1.19: Formatting.getColorValue() returns Integer, use Formatting directly
                            processed = processed.replaceAll("Formatting\\.([A-Z_]+)\\.getColorValue\\(\\) != null \\? Formatting\\.\\1\\.getColorValue\\(\\) : null", 'Formatting.$1')
                            // Pre-1.19: TranslatableTextContent doesn't exist (added in 1.19) — Text itself is the content
                            processed = processed.replaceAll("TranslatableTextContent", "TranslatableText")
                            processed = processed.replaceAll("(\\w+)\\.getContent\\(\\)", '$1')
                            processed = processed.replaceAll("instanceof net\\.minecraft\\.text\\.TranslatableText\\b", "instanceof TranslatableText")
                            // Pre-1.19: SoundEvents fields are plain SoundEvent (RegistryEntry.value() came later)
                            processed = processed.replaceAll("SoundEvents\\.(\\w+)\\.value\\(\\)", 'SoundEvents.$1')
                            // Pre-1.19: ScreenTexts class doesn't exist (added in 1.19.2)
                            processed = processed.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\.BUTTON_CANCEL", 'new TranslatableText("gui.cancel")')
                            processed = processed.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\.BUTTON_DONE", 'new TranslatableText("gui.done")')
                            processed = processed.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\.BUTTON_OK", 'new TranslatableText("gui.ok")')
                            processed = processed.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\.ON", 'new TranslatableText("options.on")')
                            processed = processed.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\.OFF", 'new TranslatableText("options.off")')
                            processed = processed.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\.DONE", 'new TranslatableText("gui.done")')
                            processed = processed.replaceAll("import net\\.minecraft\\.screen\\.ScreenTexts;", '//import net.minecraft.screen.ScreenTexts;')
                            processed = processed.replaceAll("ScreenTexts\\.BUTTON_CANCEL", 'new TranslatableText("gui.cancel")')
                            processed = processed.replaceAll("ScreenTexts\\.BUTTON_DONE", 'new TranslatableText("gui.done")')
                            processed = processed.replaceAll("ScreenTexts\\.BUTTON_OK", 'new TranslatableText("gui.ok")')
                            processed = processed.replaceAll("ScreenTexts\\.ON", 'new TranslatableText("options.on")')
                            processed = processed.replaceAll("ScreenTexts\\.OFF", 'new TranslatableText("options.off")')
                            processed = processed.replaceAll("ScreenTexts\\.DONE", 'new TranslatableText("gui.done")')
                        }
                        // Pre-1.19.3: GameRenderer shader getters are named *Shader (renamed to *Program in 1.19.3),
                        // ButtonWidget.builder() doesn't exist (added in 1.19.3)
                        if (targetMcVersion >= 11700 && targetMcVersion < 11903) {
                            processed = processed.replaceAll("getPositionTexColorProgram", "getPositionTexColorShader")
                            processed = processed.replaceAll("getPositionTexLightmapColorProgram", "getPositionTexLightmapColorShader")
                            processed = processed.replaceAll("getPositionColorProgram", "getPositionColorShader")
                            processed = processed.replaceAll("getPositionTexProgram", "getPositionTexShader")
                            processed = processed.replaceAll("ButtonWidget\\.builder\\(", "com.niuqu.chatbubble.gui.E33Button.builder(")
                        }
                        // Pre-1.20: ServerCommandSource.sendFeedback takes a Text directly; the
                        // Supplier<Text> overload only arrived in 1.20.1. Strip the lambda so
                        // src.sendFeedback(() -> new X(...), false) becomes src.sendFeedback(new X(...), false)
                        if (targetMcVersion < 12000) {
                            processed = processed.replaceAll("sendFeedback\\(\\(\\) -> ", "sendFeedback(")
                        }
                        // Pre-1.20: DrawContext wrapper is in com.niuqu.chatbubble (avoids Loom excluding net.minecraft.* sources)
                        if (targetMcVersion < 12000) {
                            processed = processed.replaceAll("import net\\.minecraft\\.client\\.gui\\.DrawContext;", "import com.niuqu.chatbubble.DrawContext;")
                            // Inline FQN references (method params/casts) too — "import X;" above only catches the import statement
                            processed = processed.replaceAll("net\\.minecraft\\.client\\.gui\\.DrawContext", "com.niuqu.chatbubble.DrawContext")
                            // Pre-1.20: Screen/widget render(DrawContext g, mouseX, mouseY, delta) → render(MatrixStack) that
                            // wraps the stack in the compat DrawContext, so the body stays source-compatible
                            processed = processed.replaceAll(
                                'public void render\\((?:com\\.niuqu\\.chatbubble\\.)?DrawContext (\\w+), int mouseX, int mouseY, float (\\w+)\\) \\{$',
                                'public void render(net.minecraft.client.util.math.MatrixStack matrices, int mouseX, int mouseY, float $2) {\n    com.niuqu.chatbubble.DrawContext $1 = new com.niuqu.chatbubble.DrawContext(matrices);'
                            )
                            // Pre-1.20: renderBackground(g) takes a MatrixStack, not the compat DrawContext
                            processed = processed.replaceAll("\\brenderBackground\\(g\\)", "renderBackground(g.getMatrices())")
                        }
                        // Pre-1.21: Tessellator.getInstance().begin(mode, format) was only added in 1.21.1;
                        // before that the buffer must be fetched with getBuffer() and begun manually
                        if (targetMcVersion >= 11700 && targetMcVersion < 12100) {
                            processed = processed.replaceAll(
                                "(\\w+) = Tessellator\\.getInstance\\(\\)\\.begin\\(",
                                '$1 = Tessellator.getInstance().getBuffer();\n$1.begin('
                            )
                        }
                        // Pre-1.19: BufferBuilder.end() returns void (BuiltBuffer came in 1.19.0), so the
                        // drawWithGlobalProgram(bb.end()) idiom must be split into end() + draw()
                        if (targetMcVersion >= 11700 && targetMcVersion < 11900) {
                            processed = processed.replaceAll(
                                "BufferRenderer\\.drawWithGlobalProgram\\((\\w+)\\.end\\(\\)\\)",
                                '$1.end(); BufferRenderer.draw($1);'
                            )
                        }
                        // 1.19.0-1.19.2: the buffer draw entry point is named drawWithShader
                        if (targetMcVersion >= 11900 && targetMcVersion < 11903) {
                            processed = processed.replaceAll(
                                "BufferRenderer\\.drawWithGlobalProgram\\(",
                                "BufferRenderer.drawWithShader("
                            )
                            // ClientPlayNetworkHandler.sendChatCommand/sendChatMessage arrived in 1.19.3;
                            // ChatSender bridges the older ClientPlayerEntity signatures
                            processed = processed.replaceAll("(\\w+)\\.player\\.networkHandler\\.sendChatCommand\\(", 'com.niuqu.chatbubble.compat.ChatSender.sendCommand($1.player, ')
                            processed = processed.replaceAll("(\\w+)\\.player\\.networkHandler\\.sendChatMessage\\(", 'com.niuqu.chatbubble.compat.ChatSender.sendChat($1.player, ')
                        }
                        // 1.20.x (MC < 1.21): team record accessors → getter methods (PlayerTeam/Team)
                        if (targetMcVersion >= 12000 && targetMcVersion < 12100) {
                            // Only match "team.prefix()/team.suffix()/team.color()" to avoid matching our own record classes
                            processed = processed.replaceAll("(?<=\\bteam)\\.prefix\\(\\)", ".getPrefix()")
                            processed = processed.replaceAll("(?<=\\bteam)\\.suffix\\(\\)", ".getSuffix()")
                            processed = processed.replaceAll("(?<=\\bteam)\\.color\\(\\)", ".getColor()")
                            // getScoreboardTeam returns AbstractTeam, cast to Team for prefix/suffix
                            processed = processed.replaceAll("\\bteam\\.getPrefix\\(\\)", "((net.minecraft.scoreboard.Team)team).getPrefix()")
                            processed = processed.replaceAll("\\bteam\\.getSuffix\\(\\)", "((net.minecraft.scoreboard.Team)team).getSuffix()")
                            // 1.20.x: KeyBinding.matches(keyCode, scanCode) → matchesKey(keyCode, scanCode)
                            processed = processed.replaceAll("\\.matches\\(keyCode, scanCode\\)", ".matchesKey(keyCode, scanCode)")
                        }
                        // Pre-1.20.2: setCursorToEnd(boolean) → setCursorToEnd() (no param; 1.20.2+ kept the boolean)
                        if (targetMcVersion < 12002) {
                            processed = processed.replaceAll("\\.setCursorToEnd\\(false\\)", ".setCursorToEnd()")
                        }
                        // 1.21.2+: DrawContext.drawTexture first param changed from Identifier to Function<Identifier, RenderLayer>
                        // Redirect all g.drawTexture(...) calls to DrawHelper.drawTexture(g, ...) which handles version differences
                        if (targetMcVersion >= 12102 && targetMcVersion < 26000) {
                            processed = processed.replaceAll("g\\.drawTexture\\(", "DrawHelper.drawTexture(g, ")
                            // 1.21.2+: GameRenderer shader program method references replaced with ShaderProgramKey fields
                            processed = processed.replaceAll(
                                "RenderSystem\\.setShader\\(GameRenderer::getPositionTexProgram\\)",
                                "RenderSystem.setShader(net.minecraft.client.gl.ShaderProgramKeys.POSITION_TEX)")
                            processed = processed.replaceAll(
                                "RenderSystem\\.setShader\\(GameRenderer::getPositionTexColorProgram\\)",
                                "RenderSystem.setShader(net.minecraft.client.gl.ShaderProgramKeys.POSITION_TEX_COLOR)")
                        }
                        // 1.21.4+: API renames
                        if (targetMcVersion >= 12104 && targetMcVersion < 26000) {
                            // Screen.filesDragged → Screen.onFilesDropped
                            processed = processed.replaceAll("\\bfilesDragged\\b", "onFilesDropped")
                        }
                        // 1.21.6: DrawContext.getMatrices() switched from MatrixStack to the JOML
                        // Matrix3x2fStack, whose stack ops are pushMatrix/popMatrix and whose
                        // translate/scale take only (x, y). The source keeps the MatrixStack form.
                        if (targetMcVersion >= 12106 && targetMcVersion < 26000) {
                            processed = processed.replaceAll("\\.getMatrices\\(\\)\\.push\\(\\)", ".getMatrices().pushMatrix()")
                            processed = processed.replaceAll("\\.getMatrices\\(\\)\\.pop\\(\\)", ".getMatrices().popMatrix()")
                            processed = processed.replaceAll("\\.getMatrices\\(\\)\\.translate\\((.+?), (.+?), [^)]+\\)", ".getMatrices().translate(\$1, \$2)")
                            processed = processed.replaceAll("\\.getMatrices\\(\\)\\.scale\\((.+?), (.+?), [^)]+\\)", ".getMatrices().scale(\$1, \$2)")
                        }
                        // 1.21.9: input rework. Element/Screen overrides take the KeyInput/Click
                        // records instead of flat int/double parameter lists, DrawContext.drawBorder
                        // became drawStrokedRectangle, and authlib 7 turned GameProfile into a record.
                        // The source keeps the flat/old form; the body re-extracts the original locals
                        // so every existing reference inside the method keeps working.
                        if (targetMcVersion >= 12109 && targetMcVersion < 26000) {
                            def indent = '(\\s*)'
                            processed = processed.replaceAll(
                                "(?m)^${indent}public boolean keyPressed\\(int keyCode, int scanCode, int modifiers\\) \\{",
                                '$1public boolean keyPressed(net.minecraft.client.input.KeyInput keyInput) {\n' +
                                '$1    int keyCode = keyInput.key();\n' +
                                '$1    int scanCode = keyInput.scancode();\n' +
                                '$1    int modifiers = keyInput.modifiers();')
                            // ChatScreen gained a `draft` flag; the source keeps the old one-arg form
                            processed = processed.replaceAll("(?m)^(\\s*)super\\(\"\"\\);", '$1super("", false);')
                            // The injected parameter is named clickInput, not click: method bodies may
                            // already declare a local named `click` (e.g. the ClickEvent branch).
                            processed = processed.replaceAll(
                                "(?m)^${indent}public boolean mouseClicked\\(double mouseX, double mouseY, int button\\) \\{",
                                '$1public boolean mouseClicked(net.minecraft.client.gui.Click clickInput, boolean doubled) {\n' +
                                '$1    double mouseX = clickInput.x();\n' +
                                '$1    double mouseY = clickInput.y();\n' +
                                '$1    int button = clickInput.button();')
                            processed = processed.replaceAll(
                                "(?m)^${indent}public boolean mouseDragged\\(double mouseX, double mouseY, int button, double (\\w+), double (\\w+)\\) \\{",
                                '$1public boolean mouseDragged(net.minecraft.client.gui.Click clickInput, double $2, double $3) {\n' +
                                '$1    double mouseX = clickInput.x();\n' +
                                '$1    double mouseY = clickInput.y();\n' +
                                '$1    int button = clickInput.button();')
                            processed = processed.replaceAll(
                                "(?m)^${indent}public boolean mouseReleased\\(double mouseX, double mouseY, int button\\) \\{",
                                '$1public boolean mouseReleased(net.minecraft.client.gui.Click clickInput) {\n' +
                                '$1    double mouseX = clickInput.x();\n' +
                                '$1    double mouseY = clickInput.y();\n' +
                                '$1    int button = clickInput.button();')
                            // super and Element/KeyBinding call sites that pass the flat parameters
                            processed = processed.replaceAll("super\\.keyPressed\\(keyCode, scanCode, modifiers\\)", "super.keyPressed(keyInput)")
                            processed = processed.replaceAll("super\\.mouseClicked\\(mouseX, mouseY, button\\)", "super.mouseClicked(clickInput, doubled)")
                            processed = processed.replaceAll("super\\.mouseDragged\\(mouseX, mouseY, button, ", "super.mouseDragged(clickInput, ")
                            processed = processed.replaceAll("super\\.mouseReleased\\(mouseX, mouseY, button\\)", "super.mouseReleased(clickInput)")
                            // ClickableWidget.onClick/onRelease/onDrag take Click too
                            processed = processed.replaceAll(
                                "(\\w+(?:\\.\\w+)*)\\.onClick\\(([^,()]+), ([^,()]+)\\)",
                                'com.niuqu.chatbubble.compat.InputCompat.onClick($1, $2, $3)')
                            processed = processed.replaceAll("this\\.getFocused\\(\\)\\.keyPressed\\(keyCode, scanCode, modifiers\\)",
                                'this.getFocused().keyPressed(com.niuqu.chatbubble.compat.InputCompat.key(keyCode, scanCode, modifiers))')
                            processed = processed.replaceAll("commandSuggestions\\.keyPressed\\(keyCode, scanCode, modifiers\\)",
                                'commandSuggestions.keyPressed(com.niuqu.chatbubble.compat.InputCompat.key(keyCode, scanCode, modifiers))')
                            processed = processed.replaceAll("commandSuggestions\\.mouseClicked\\(\\(int\\) mouseX, \\(int\\) mouseY, button\\)",
                                'commandSuggestions.mouseClicked(com.niuqu.chatbubble.compat.InputCompat.click(mouseX, mouseY, button))')
                            processed = processed.replaceAll("client\\.options\\.chatKey\\.matchesKey\\(keyCode, scanCode\\)",
                                'client.options.chatKey.matchesKey(com.niuqu.chatbubble.compat.InputCompat.key(keyCode, scanCode, 0))')
                            // widget.mouseClicked(x, y, button) → ClickableWidget.mouseClicked(Click, boolean)
                            processed = processed.replaceAll(
                                "(\\w+(?:\\.\\w+)*)\\.mouseClicked\\(([^,()]+), ([^,()]+), ([^,()]+)\\)",
                                'com.niuqu.chatbubble.compat.InputCompat.mouseClicked($1, $2, $3, $4)')
                            processed = processed.replaceAll("Screen\\.hasShiftDown\\(\\)",
                                "com.niuqu.chatbubble.compat.InputCompat.hasShiftDown()")
                            // 1.21.9 renamed DrawContext.drawBorder to drawStrokedRectangle (same params)
                            processed = processed.replaceAll("\\.drawBorder\\(", ".drawStrokedRectangle(")
                            // authlib 7 (used from 1.21.9 on) turned GameProfile into a record
                            processed = processed.replaceAll("\\.getProfile\\(\\)\\.getName\\(\\)", ".getProfile().name()")
                            processed = processed.replaceAll("\\.getProfile\\(\\)\\.getId\\(\\)", ".getProfile().id()")
                            processed = processed.replaceAll("\\bgameProfile\\.getName\\(\\)", "gameProfile.name()")
                            processed = processed.replaceAll("\\bgameProfile\\.getId\\(\\)", "gameProfile.id()")
                            // ServerPlayerEntity.getServer() removed → reach the server through the world
                            processed = processed.replaceAll("\\b(sender|player)\\.getServer\\(\\)", '$1.getEntityWorld().getServer()')
                        }
                        // 1.21.11: permission / sound / text-click / screen-sizing rework.
                        // - ServerCommandSource and ServerPlayerEntity lost hasPermissionLevel(int);
                        //   the check now goes through the level-backed PermissionPredicate
                        //   (LeveledPermissionPredicate.hasPermission(Permission.Level) is ">= level").
                        // - PositionedSoundInstance.master was renamed to ui (same parameters).
                        // - Screen.handleTextClick(Style) was replaced by the static
                        //   handleClickEvent(ClickEvent, MinecraftClient, Screen).
                        // - Screen.resize/init dropped their leading MinecraftClient parameter.
                        if (targetMcVersion >= 12111 && targetMcVersion < 26000) {
                            processed = processed.replaceAll(
                                "(\\w+(?:\\.\\w+)*)\\.hasPermissionLevel\\((\\d+)\\)",
                                '$1.getPermissions().hasPermission(new net.minecraft.command.permission.Permission.Level(net.minecraft.command.permission.PermissionLevel.fromLevel($2)))')
                            processed = processed.replaceAll("PositionedSoundInstance\\.master\\(", "PositionedSoundInstance.ui(")
                            processed = processed.replaceAll(
                                "\\bhandleTextClick\\(([^()]+)\\)",
                                'handleClickEvent($1.getClickEvent(), this.client, this)')
                            processed = processed.replaceAll(
                                "(?m)^(\\s*)public void resize\\(MinecraftClient \\w+, int (\\w+), int (\\w+)\\) \\{",
                                '$1public void resize(int $2, int $3) {')
                            processed = processed.replaceAll("this\\.init\\(client, (\\w+), (\\w+)\\)", 'this.init($1, $2)')
                        }
                        // Pre-1.19.3: ClickableWidget getX()/getY()/setY() → direct field access.
                        // The accessors only appeared in 1.19.3, when the x/y fields turned private.
                        if (targetMcVersion < 11903) {
                            processed = processed.replaceAll("(\\w+)\\.setY\\(([^)]+)\\)", '$1.y = $2')
                            processed = processed.replaceAll("(\\w+)\\.getX\\(\\)", '$1.x')
                            processed = processed.replaceAll("(\\w+)\\.getY\\(\\)", '$1.y')
                            // Rect2i keeps private x/y fields in every version, so restore its accessors
                            // (the rewrite above cannot tell the receiver type apart)
                            processed = processed.replaceAll("\\barea\\.y = ([^;]+);", 'area.setY($1);')
                            processed = processed.replaceAll("\\barea\\.x\\b", "area.getX()")
                            processed = processed.replaceAll("\\barea\\.y\\b", "area.getY()")
                        }
                        // Pre-1.20: widget/screen shims that only apply below 1.20
                        if (targetMcVersion < 12000) {
                            // Undo the getX/getY swap for Mouse: in 1.16.5 client.mouse.x/y ARE private
                            // (fields private, getter getX()/getY() public) — only ClickableWidget fields are public.
                            processed = processed.replaceAll("\\bclient\\.mouse\\.x\\b", "client.mouse.getX()")
                            processed = processed.replaceAll("\\bclient\\.mouse\\.y\\b", "client.mouse.getY()")
                            // Pre-1.20: ClickableWidget.setFocused(boolean) is protected; Screen.setFocused(Element) handles focus
                            processed = processed.replaceAll("(\\w+)\\.setFocused\\(false\\)", '/* focus handled by Screen */')
                            // Pre-1.20: Style.withColor(int) → Style.withColor(TextColor.fromRgb(int))
                            processed = processed.replaceAll("\\.withColor\\((\\w+)\\)", '.withColor(TextColor.fromRgb($1))')
                            // Pre-1.20: DrawContext.render(g,...) → widget.render(g.getMatrices(),...)
                            processed = processed.replaceAll("(\\w+)\\.render\\(g,", '$1.render(g.getMatrices(),')
                            // ...but our own panels/banners are NOT vanilla widgets: they take the compat
                            // DrawContext directly, so undo the rewrite for them
                            processed = processed.replaceAll("\\b(settingsMenu|emojiPanel|quickChatPanel|searchPanel|groupBrowser)\\.render\\(g\\.getMatrices\\(\\)", '$1.render(g')
                            processed = processed.replaceAll("MentionNotificationBanner\\.INSTANCE\\.render\\(g\\.getMatrices\\(\\)", "MentionNotificationBanner.INSTANCE.render(g")
                            // Pre-1.20: renderBackground(MatrixStack) — convert the override declaration
                            processed = processed.replaceAll("public void renderBackground\\(DrawContext g\\)", "public void renderBackground(net.minecraft.client.util.math.MatrixStack matrices)")
                            // Pre-1.20: DrawContext.drawHoverEvent already stubbed in compat class
                            // ScreenTexts is left alone here: the class exists from 1.19.2 onwards and the
                            // pre-1.19 branch below already substitutes it with TranslatableText.
                            // Pre-1.20: import TextColor for withColor replacement
                            processed = processed.replaceAll("import net\\.minecraft\\.text\\.Style;", 'import net.minecraft.text.Style;\nimport net.minecraft.text.TextColor;')
                        }
                        // Pre-1.19.3: org.joml isn't on the classpath; use net.minecraft.util.math
                        if (targetMcVersion < 11903 && targetMcVersion < 26000) {
                            processed = processed.replaceAll("import org\\.joml\\.Matrix4f;", "import net.minecraft.util.math.Matrix4f;")
                            processed = processed.replaceAll("import org\\.joml\\.Vector4f;", "import net.minecraft.util.math.Vector4f;")
                            // Pre-1.19: getPositionMatrix() → getModel() (MatrixStack peek returns different type)
                            if (targetMcVersion < 11700) {
                                processed = processed.replaceAll("\\.getPositionMatrix\\(\\)", ".getModel()")
                            }
                        }
                        // Pre-1.19.3: SoundEvents fields are plain SoundEvent (RegistryEntry.value() came in 1.19.3)
                        if (targetMcVersion >= 11900 && targetMcVersion < 11903) {
                            processed = processed.replaceAll("SoundEvents\\.(\\w+)\\.value\\(\\)", 'SoundEvents.$1')
                        }
                        // Pre-1.20: AbstractTeam has no getPrefix()/getSuffix() — they live on the Team
                        // interface/class, so widen the receiver type (getScoreboardTeam() returns
                        // AbstractTeam until 1.20.1)
                        if (targetMcVersion >= 11700 && targetMcVersion < 12000) {
                            processed = processed.replaceAll("\\bteam\\.getPrefix\\(\\)", "((net.minecraft.scoreboard.Team)team).getPrefix()")
                            processed = processed.replaceAll("\\bteam\\.getSuffix\\(\\)", "((net.minecraft.scoreboard.Team)team).getSuffix()")
                        }
                        if (targetMcVersion < 11700) {
                            // 1.16.5 only: setScreen → openScreen
                            processed = processed.replaceAll("client\\.setScreen\\(", "client.openScreen(")
                            processed = processed.replaceAll("MinecraftClient\\.getInstance\\(\\)\\.setScreen\\(", "MinecraftClient.getInstance().openScreen(")
                            // 1.16.5: chatKey → keyChat (field renamed in 1.17)
                            processed = processed.replaceAll("\\bchatKey\\b", "keyChat")
                            // 1.16.5: addDrawableChild → addButton (addDrawableChild introduced in 1.17)
                            processed = processed.replaceAll("\\baddDrawableChild\\(", "addButton(")
                            // 1.16.5: ButtonWidget has no .builder() — route through a compat fluent page
                            // builder so the full `.dimensions()/.position()/.size()/.build()` chain still works
                            // (raw regex cannot reorder constructor args around a lambda, so a compat class is used)
                            processed = processed.replaceAll("ButtonWidget\\.builder\\(", "com.niuqu.chatbubble.gui.E33Button.builder(")
                            // 1.16.5: Screen.clearChildren() doesn't exist — clear the two backing lists
                            processed = processed.replaceAll("\\bclearChildren\\(\\);", "this.buttons.clear(); this.children.clear();")
                            // 1.16.5: ScreenTexts.DONE → TranslatableText (ScreenTexts class added in 1.19.3)
                            processed = processed.replaceAll("ScreenTexts\\.DONE", 'new TranslatableText("gui.done")')
                            // 1.16.5: ServerCommandSource.getServer() → getMinecraftServer()
                            processed = processed.replaceAll("\\b(source|src)\\.getServer\\(\\)", '$1.getMinecraftServer()')
                            // 1.16.5: Screen.shouldPause() → isPauseScreen() (renamed in 1.19.3)
                            processed = processed.replaceAll("\\bshouldPause\\(\\)", "isPauseScreen()")
                            // 1.16.5: SoundEvents.X.value() → SoundEvents.X (SoundEvent is a direct field, not RegistryEntry)
                            processed = processed.replaceAll("SoundEvents\\.(\\w+)\\.value\\(\\)", 'SoundEvents.$1')
                            // 1.16.5: TranslatableTextContent → TranslatableText (Text content API doesn't exist)
                            processed = processed.replaceAll("TranslatableTextContent", "TranslatableText")
                            // 1.16.5: message.getContent() → message (Text itself is the content in 1.16.5)
                            processed = processed.replaceAll("(\\w+)\\.getContent\\(\\)", '$1')
                            // 1.16.5: instanceof TranslatableTextContent → instanceof TranslatableText
                            processed = processed.replaceAll("instanceof net\\.minecraft\\.text\\.TranslatableText", "instanceof TranslatableText")
                            // 1.16.5: AbstractTeam.getPrefix()/getSuffix() → cast to Team
                            processed = processed.replaceAll("\\bteam\\.getPrefix\\(\\)", "((net.minecraft.scoreboard.Team)team).getPrefix()")
                            processed = processed.replaceAll("\\bteam\\.getSuffix\\(\\)", "((net.minecraft.scoreboard.Team)team).getSuffix()")
                            // 1.16.5: GlStateManager lacks texture mgmt methods → raw GL30 (blaze3d API added in 1.17)
                            processed = processed.replaceAll("GlStateManager\\._genTexture\\(\\)", "GL30.glGenTextures()")
                            processed = processed.replaceAll("GlStateManager\\._bindTexture\\((\\w+)\\)", "GL30.glBindTexture(GL30.GL_TEXTURE_2D, \$1)")
                            processed = processed.replaceAll("GlStateManager\\._texParameter\\((\\w+), (\\w+), (\\w+)\\)", "GL30.glTexParameteri(\$1, \$2, \$3)")
                            processed = processed.replaceAll("GlStateManager\\._texImage2D\\(", "GL30.glTexImage2D(")
                            processed = processed.replaceAll("GlStateManager\\._deleteTexture\\((\\w+)\\)", "GL30.glDeleteTextures(\$1)")
                            // 1.16.5: NativeImage(NativeImage.Format.RGBA, w, h, useLinear) → NativeImage(w, h, useLinear) (no Format enum)
                            processed = processed.replaceAll("new NativeImage\\(NativeImage\\.Format\\.RGBA, ", "new NativeImage(")
                            // 1.16.5: JsonParser.parseString(x) → new JsonParser().parse(x) (parse is instance method in older Gson)
                            processed = processed.replaceAll("JsonParser\\.parseString\\(", "new JsonParser().parse(")
                            // 1.16.5: VertexFormat.DrawMode.QUADS → 7 (GL_QUADS int, no DrawMode enum)
                            processed = processed.replaceAll("VertexFormat\\.DrawMode\\.QUADS", "7")
                            // 1.16.5: RenderSystem.setShaderTexture(0, tex) → TextureManager.bindTexture(tex)
                            // (fully-qualified MinecraftClient: some files don't import it)
                            processed = processed.replaceAll("RenderSystem\\.setShaderTexture\\(0, ([^)]+)\\)", 'net.minecraft.client.MinecraftClient.getInstance().getTextureManager().bindTexture($1)')
                            // 1.16.5: Remove RenderSystem.setShader(GameRenderer::*) - fixed-function pipeline
                            processed = processed.replaceAll("RenderSystem\\.setShader\\(GameRenderer::\\w+\\);", "// shader not needed in 1.16.5")
                            // 1.16.5: buffer.end() → Tessellator.getInstance().draw() (1.17+ split into end+draw)
                            processed = processed.replaceAll("buffer\\.end\\(\\);", "Tessellator.getInstance().draw();")
                            // 1.16.5: BufferRenderer.draw(buffer) already handled by Tessellator.draw()
                            processed = processed.replaceAll("BufferRenderer\\.draw\\(buffer\\);", "// handled by Tessellator.draw()")
                            // 1.16.5: org.joml → net.minecraft.client.util.math
                            processed = processed.replaceAll("import org\\.joml\\.Matrix4f;", "import net.minecraft.client.util.math.Matrix4f;")
                            processed = processed.replaceAll("import org\\.joml\\.Vector4f;", "import net.minecraft.client.util.math.Vector4f;")
                            // 1.16.5: getPositionMatrix() → getModel()
                            processed = processed.replaceAll("\\.getPositionMatrix\\(\\)", ".getModel()")
                            // 1.16.5: m00() → m00 (field access, not method)
                            processed = processed.replaceAll("\\.m00\\(\\)", ".m00")
                            // 1.16.5: BufferRenderer.drawWithGlobalProgram(x.end()) → Tessellator.getInstance().draw()
                            processed = processed.replaceAll("BufferRenderer\\.drawWithGlobalProgram\\([^)]+\\.end\\(\\)\\)", "Tessellator.getInstance().draw()")
                            // 1.16.5: Tessellator.getInstance().begin(mode, format) → getBuffer() + begin()
                            processed = processed.replaceAll(
                                "(\\w+) = Tessellator\\.getInstance\\(\\)\\.begin\\(",
                                '$1 = Tessellator.getInstance().getBuffer();\n$1.begin('
                            )
                            // 1.16.5: Remove RenderSystem.setShader(GameRenderer::*) already handled above
                            // 1.16.5: Remove RenderSystem.setShader(() -> var) - custom shader
                            processed = processed.replaceAll("RenderSystem\\.setShader\\(\\(\\) -> \\w+\\);", "// shader not needed in 1.16.5")
                            // 1.16.5: Matrix4f.transform(Vector4f) → Vector4f.multiply(Matrix4f) in-place
                            processed = processed.replaceAll(
                                "Vector4f (\\w+) = (\\w+)\\.transform\\(new Vector4f\\((.+?)\\)\\);",
                                'Vector4f $1 = new Vector4f($3); $1.multiply($2);'
                            )
                            // 1.16.5: Screen.close() → Screen.onClose() (renamed in 1.17)
                            processed = processed.replaceAll("public void close\\(\\)", "public void onClose()")
                            processed = processed.replaceAll("(?<![\\w.])close\\(\\);", "onClose();")
                            processed = processed.replaceAll("super\\.close\\(\\)", "super.onClose()")
                        }
                        outLines.add(processed)
                    }
                }
                // 26.x: 注入额外 import（类移动到了不同的包）
                if (targetMcVersion >= 26000) {
                    def pkgIdx = -1
                    for (int i = 0; i < outLines.size(); i++) {
                        if (outLines[i].startsWith("package ")) { pkgIdx = i; break }
                    }
                    if (pkgIdx >= 0) {
                        def content = outLines.join("\n")
                        def toAdd = []
                        if (content.contains("FormattedCharSequence") &&
                            !outLines.any { it.trim() == "import net.minecraft.util.FormattedCharSequence;" })
                            toAdd.add("import net.minecraft.util.FormattedCharSequence;")
                        if (content.contains("TranslatableContents") &&
                            !outLines.any { it.trim() == "import net.minecraft.network.chat.contents.TranslatableContents;" })
                            toAdd.add("import net.minecraft.network.chat.contents.TranslatableContents;")
                        if (toAdd) outLines.addAll(pkgIdx + 1, toAdd)
                    }
                }
                // 1.21.2+: 注入 DrawHelper import（g.drawTexture → DrawHelper.drawTexture 重定向需要）
                if (targetMcVersion >= 12102 && targetMcVersion < 26000) {
                    def pkgIdx = -1
                    for (int i = 0; i < outLines.size(); i++) {
                        if (outLines[i].startsWith("package ")) { pkgIdx = i; break }
                    }
                    if (pkgIdx >= 0) {
                        def content = outLines.join("\n")
                        def toAdd = []
                        if (content.contains("DrawHelper.drawTexture") &&
                            !outLines.any { it.trim() == "import com.niuqu.chatbubble.DrawHelper;" })
                            toAdd.add("import com.niuqu.chatbubble.DrawHelper;")
                        if (toAdd) outLines.addAll(pkgIdx + 1, toAdd)
                    }
                }
                // 26.x: 直接调用点统一改走 DrawHelper（blit 需要显式 RenderPipeline），
                // 因此和 1.21.2~1.21.11 一样需要注入 import（方法名此时已映射为 blit）
                if (targetMcVersion >= 26000) {
                    def pkgIdx = -1
                    for (int i = 0; i < outLines.size(); i++) {
                        if (outLines[i].startsWith("package ")) { pkgIdx = i; break }
                    }
                    if (pkgIdx >= 0 && outLines[pkgIdx].trim() != "package com.niuqu.chatbubble;") {
                        def content26 = outLines.join("\n")
                        def toAdd26 = []
                        if (content26.contains("DrawHelper.blit") &&
                            !outLines.any { it.trim() == "import com.niuqu.chatbubble.DrawHelper;" })
                            toAdd26.add("import com.niuqu.chatbubble.DrawHelper;")
                        if (toAdd26) outLines.addAll(pkgIdx + 1, toAdd26)
                    }
                }
                // Pre-1.19: 注入 LiteralText/TranslatableText import
                if (targetMcVersion < 11900 && targetMcVersion < 26000) {
                    def pkgIdx = -1
                    for (int i = 0; i < outLines.size(); i++) {
                        if (outLines[i].startsWith("package ")) { pkgIdx = i; break }
                    }
                    if (pkgIdx >= 0) {
                        def content = outLines.join("\n")
                        def toAdd = []
                        if (content.contains("LiteralText") &&
                            !outLines.any { it.trim() == "import net.minecraft.text.LiteralText;" })
                            toAdd.add("import net.minecraft.text.LiteralText;")
                        if (content.contains("TranslatableText") && !content.contains("TranslatableTextContent") &&
                            !outLines.any { it.trim() == "import net.minecraft.text.TranslatableText;" })
                            toAdd.add("import net.minecraft.text.TranslatableText;")
                        if (toAdd) outLines.addAll(pkgIdx + 1, toAdd)
                    }
                }
                outFile.write(outLines.join('\n'), 'UTF-8')
            }
        }
    }

    static String uncommentPreprocessLine(String line) {
        def matcher = (line =~ /^(\s*)\/\/\$\$ ?(.*)$/)
        return matcher.matches() ? matcher.group(1) + matcher.group(2) : line
    }

    static boolean evaluate(String expr, int ver) {
        def m = (expr =~ /^\s*MC\s*(>=|<=|==|!=|<|>)\s*(\d+)\s*$/)
        if (m.matches()) {
            def op = m.group(1)
            def val = Integer.parseInt(m.group(2))
            switch (op) {
                case '>=': return ver >= val
                case '<=': return ver <= val
                case '==': return ver == val
                case '!=': return ver != val
                case '<':  return ver < val
                case '>':  return ver > val
            }
        }
        return true
    }

    // Yarn→Mojang 26.x 名称映射 (MC 26.x 取消混淆，使用 Mojang 官方名称)
    static String applyMojangMapping(String line, int targetMcVersion) {
        boolean is26_2 = targetMcVersion >= 260200

        // Step 1: FQN-specific mappings (must come before package replacements)
        line = line.replaceAll("net\\.minecraft\\.util\\.Identifier\\b", "net.minecraft.resources.Identifier")
        line = line.replaceAll("net\\.minecraft\\.util\\.Formatting\\b", "net.minecraft.ChatFormatting")
        line = line.replaceAll("net\\.minecraft\\.util\\.Language\\b", "net.minecraft.locale.Language")
        line = line.replaceAll("net\\.minecraft\\.util\\.Rect2i\\b", "net.minecraft.client.renderer.Rect2i")
        line = line.replaceAll("net\\.minecraft\\.client\\.util\\.math\\.Rect2i\\b", "net.minecraft.client.renderer.Rect2i")
        line = line.replaceAll("net\\.minecraft\\.text\\.OrderedText\\b", "net.minecraft.util.FormattedCharSequence")
        line = line.replaceAll("net\\.minecraft\\.text\\.TextCodecs\\b", "net.minecraft.network.chat.ComponentSerialization")
        line = line.replaceAll("net\\.minecraft\\.text\\.TranslatableTextContent\\b", "net.minecraft.network.chat.contents.TranslatableContents")
        line = line.replaceAll("net\\.minecraft\\.screen\\.ScreenTexts\\b", "net.minecraft.network.chat.CommonComponents")
        line = line.replaceAll("net\\.minecraft\\.registry\\.entry\\.RegistryEntry\\b", "net.minecraft.core.Holder")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.DrawContext\\b", "net.minecraft.client.gui.GuiGraphicsExtractor")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.Click\\b", "net.minecraft.client.input.MouseButtonEvent")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.Element\\b", "net.minecraft.client.gui.components.events.GuiEventListener")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.PlayerSkinDrawer\\b", "net.minecraft.client.gui.components.PlayerFaceExtractor")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.screen\\.ChatInputSuggestor\\b", "net.minecraft.client.gui.components.CommandSuggestions")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.screen\\.SleepingChatScreen\\b", "net.minecraft.client.gui.screens.InBedChatScreen")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.hud\\.ChatHud\\b", "net.minecraft.client.gui.components.ChatComponent")
        line = line.replaceAll("net\\.minecraft\\.client\\.gui\\.hud\\.MessageIndicator\\b", "net.minecraft.client.gui.components.MessageIndicator")
        line = line.replaceAll("net\\.minecraft\\.client\\.texture\\.NativeImage\\b", "com.mojang.blaze3d.platform.NativeImage")
        line = line.replaceAll("net\\.minecraft\\.client\\.sound\\.PositionedSoundInstance\\b", "net.minecraft.client.resources.sounds.SimpleSoundInstance")
        line = line.replaceAll("net\\.minecraft\\.client\\.util\\.DefaultSkinHelper\\b", "net.minecraft.client.resources.DefaultPlayerSkin")
        line = line.replaceAll("net\\.minecraft\\.client\\.Mouse\\b", "net.minecraft.client.MouseHandler")
        line = line.replaceAll("net\\.minecraft\\.client\\.input\\.MouseInput\\b", "net.minecraft.client.input.MouseButtonInfo")
        line = line.replaceAll("net\\.minecraft\\.entity\\.player\\.SkinTextures\\b", "net.minecraft.world.entity.player.PlayerSkin")
        // 26.x: ClientPlayerEntity 从 network 包迁到 client.player，并改名为 LocalPlayer
        line = line.replaceAll("net\\.minecraft\\.client\\.network\\.ClientPlayerEntity\\b", "net.minecraft.client.player.LocalPlayer")
