        // Resource.getInputStream → open
        line = line.replaceAll("\\bgetInputStream\\b", "open")
        // ChatType.Bound.type() → chatType()
        line = line.replaceAll("\\bparams\\.type\\(\\)", "params.chatType()")
        // 26.x: chatType() 返回 Holder<ChatType>，判定条件用 is(ResourceKey) 而不是 matchesKey
        line = line.replaceAll("\\.chatType\\(\\)\\.matches\\(", ".chatType().is(")
        // 26.x: ChatType.Bound.applyChatDecoration → decorate
        line = line.replaceAll("\\bapplyChatDecoration\\b", "decorate")
        // 26.x: GameType 只有 getShortDisplayName()/getLongDisplayName()，没有 getTranslatableName()
        line = line.replaceAll("\\bgetTranslatableName\\b", "getShortDisplayName")
        // 26.x: NativeImage pixel access — getPixelABGR is private, getPixel is public
        // setPixelRGBA → setPixelABGR (public), getPixelRGBA → getPixel (public)
        line = line.replaceAll("\\bsetPixelRGBA\\b", "setPixelABGR")
        line = line.replaceAll("\\bgetPixelRGBA\\b", "getPixel")
        // setPixel → setPixelABGR (both public in 26.x, ABGR is the canonical name)
        line = line.replaceAll("\\bsetPixel\\b", "setPixelABGR")

        // Step 5: Class name replacements (word-boundary regex, longest names first)
        line = line.replaceAll("\\bRegistryWrapper\\.WrapperLookup\\b", "HolderLookup.Provider")
        line = line.replaceAll("\\bRegistryWrapper\\.Impl\\b", "HolderLookup.RegistryLookup")
        line = line.replaceAll("\\bRegistryWrapper\\b", "HolderLookup")
        line = line.replaceAll("\\bRegistryKey\\b", "ResourceKey")
        line = line.replaceAll("\\bRenderLayer\\b", "RenderType")
        line = line.replaceAll("\\bBuiltinRegistries\\b", "BuiltInRegistries")
        line = line.replaceAll("\\bGuiNavigation\\.Tab\\b", "FocusNavigationEvent.TabNavigation")
        line = line.replaceAll("\\bGuiNavigation\\.Arrow\\b", "FocusNavigationEvent.ArrowNavigation")
        line = line.replaceAll("\\bGuiNavigation\\b", "FocusNavigationEvent")
        line = line.replaceAll("\\bNavigationDirection\\b", "ScreenDirection")
        line = line.replaceAll("\\bGuiNavigationPath\\b", "ComponentPath")
        line = line.replaceAll("\\bNativeImageBackedTexture\\b", "DynamicTexture")
        line = line.replaceAll("\\bServerPlayerEntity\\b", "ServerPlayer")
        line = line.replaceAll("\\bPlayerEntity\\b", "Player")
        line = line.replaceAll("\\bPlayerListEntry\\b", "PlayerInfo")
        line = line.replaceAll("\\bClientPlayerEntity\\b", "LocalPlayer")
        line = line.replaceAll("\\bGameMode\\b", "GameType")
        line = line.replaceAll("\\bClientPlayNetworkHandler\\b", "ClientPacketListener")
        line = line.replaceAll("\\bPositionedSoundInstance\\b", "SimpleSoundInstance")
        line = line.replaceAll("\\bPacketByteBuf\\b", "FriendlyByteBuf")
        line = line.replaceAll("\\bPacketCodec\\b", "StreamCodec")
        line = line.replaceAll("\\bMinecraftClient\\b", "Minecraft")
        line = line.replaceAll("\\bMathHelper\\b", "Mth")
        line = line.replaceAll("\\bDrawContext\\b", "GuiGraphicsExtractor")
        line = line.replaceAll("\\bButtonWidget\\b", "Button")
        line = line.replaceAll("\\bTextFieldWidget\\b", "EditBox")
        line = line.replaceAll("\\bClickableWidget\\b", "AbstractWidget")
        line = line.replaceAll("\\bSliderWidget\\b", "AbstractSliderButton")
        line = line.replaceAll("\\bMutableText\\b", "MutableComponent")
        line = line.replaceAll("\\bOrderedText\\b", "FormattedCharSequence")
        line = line.replaceAll("\\bTextCodecs\\b", "ComponentSerialization")
        line = line.replaceAll("\\bTranslatableTextContent\\b", "TranslatableContents")
        line = line.replaceAll("\\bTextRenderer\\b", "Font")
        line = line.replaceAll("\\bFormatting\\b", "ChatFormatting")
        line = line.replaceAll("\\bDefaultSkinHelper\\b", "DefaultPlayerSkin")
        line = line.replaceAll("\\bPlayerSkinDrawer\\b", "PlayerFaceExtractor")
        line = line.replaceAll("\\bSkinTextures\\b", "PlayerSkin")
        line = line.replaceAll("\\bServerCommandSource\\b", "CommandSourceStack")
        line = line.replaceAll("\\bChatHud\\b", "ChatComponent")
        line = line.replaceAll("\\bChatInputSuggestor\\b", "CommandSuggestions")
        line = line.replaceAll("\\bSuggestionWindow\\b", "SuggestionsList")
        line = line.replaceAll("\\bMessageHandler\\b", "ChatListener")
        line = line.replaceAll("\\bSleepingChatScreen\\b", "InBedChatScreen")
        line = line.replaceAll("\\bCommandManager\\b", "Commands")
        line = line.replaceAll("\\bMessageType\\b", "ChatType")
        line = line.replaceAll("\\bSignedMessage\\b", "PlayerChatMessage")
        line = line.replaceAll("\\bMessageSignatureData\\b", "MessageSignature")
        line = line.replaceAll("\\bClientCommandC2SPacket\\b", "ServerboundPlayerCommandPacket")
        line = line.replaceAll("\\bRegistryEntryList\\b", "HolderSet")
        line = line.replaceAll("\\bRegistryEntry\\b", "Holder")
        line = line.replaceAll("\\bKeyBinding\\b", "KeyMapping")
        line = line.replaceAll("\\bKeyInput\\b", "KeyEvent")
        line = line.replaceAll("\\bMouseInput\\b", "MouseButtonInfo")
        line = line.replaceAll("\\bMouse\\b", "MouseHandler")
        line = line.replaceAll("\\bStringVisitable\\b", "FormattedText")
        line = line.replaceAll("\\bWorldSavePath\\b", "LevelResource")
        line = line.replaceAll("\\bMatrixStack\\b", "PoseStack")
        line = line.replaceAll("\\bVertexConsumerProvider\\b", "MultiBufferSource")
        line = line.replaceAll("\\bImmediateRender\\b", "MultiBufferSource.BufferSource")
        line = line.replaceAll("\\bCustomPayload\\b", "CustomPacketPayload")
        line = line.replaceAll("\\bScreenTexts\\b", "CommonComponents")
        line = line.replaceAll("\\bPressAction\\b", "OnPress")
        line = line.replaceAll("\\bResourceType\\b", "PackType")
        line = line.replaceAll("\\bElement\\b", "GuiEventListener")
        line = line.replaceAll("\\bDrawable\\b", "Renderable")
        line = line.replaceAll("\\bSelectable\\b", "NarratableEntry")
        line = line.replaceAll("\\bClick\\b", "MouseButtonEvent")
        line = line.replaceAll("\\bInputUtil\\b", "InputConstants")
        line = line.replaceAll("\\bHoveredTooltipPositioner\\b", "DefaultTooltipPositioner")
        // 26.x: blaze3d rendering class renames
        line = line.replaceAll("\\bTessellator\\b", "Tesselator")
        line = line.replaceAll("\\bVertexFormats\\b", "DefaultVertexFormat")
        line = line.replaceAll("\\bGlUniform\\b", "Uniform")
        line = line.replaceAll("\\bBufferRenderer\\b", "Tesselator")
        line = line.replaceAll("\\bShaderProgram\\b", "ShaderManager")
        // 26.x: VertexFormat.DrawMode → VertexFormat.Mode
        line = line.replaceAll("\\bDrawMode\\b", "Mode")
        // Standalone Text must come last (after all *Text and Text* names)
        line = line.replaceAll("\\bText\\b", "Component")

        // Step 5b: Post-class-name method mappings (need Mojang class names from Step 5)
        line = line.replaceAll("FormattedText\\.plain\\b", "FormattedText.of")
        line = line.replaceAll("FormattedText\\.concat\\b", "FormattedText.composite")
        line = line.replaceAll("DefaultPlayerSkin\\.getSkin\\b", "DefaultPlayerSkin.get")
        line = line.replaceAll("CommonComponents\\.DONE\\b", "CommonComponents.GUI_DONE")
        line = line.replaceAll("CommonComponents\\.ON\\b", "CommonComponents.OPTION_ON")
        line = line.replaceAll("CommonComponents\\.OFF\\b", "CommonComponents.OPTION_OFF")
        // 26.x: GuiGraphicsExtractor.drawBorder → outline (same params)
        line = line.replaceAll("\\.drawBorder\\(", ".outline(")
        // 26.x: Button.Builder.position → pos
        line = line.replaceAll("\\.position\\(", ".pos(")
        // 26.x: Screen.clearChildren → clearWidgets
        line = line.replaceAll("(?<![\\w\$])clearChildren\\(\\)", "clearWidgets()")
        // 26.x: KeyMapping.unpressAll → releaseAll (static)
        line = line.replaceAll("KeyMapping\\.unpressAll\\(", "KeyMapping.releaseAll(")
        // 26.x: SimpleSoundInstance.master → forUI
        line = line.replaceAll("SimpleSoundInstance\\.master\\(", "SimpleSoundInstance.forUI(")
        // 26.x: EditBox accessors (yarn setSelectionStart/End, getCursor, write)
        line = line.replaceAll("\\.getCursor\\(\\)", ".getCursorPosition()")
        line = line.replaceAll("\\.setSelectionStart\\(", ".setCursorPosition(")
        line = line.replaceAll("\\.setSelectionEnd\\(", ".setHighlightPos(")
        line = line.replaceAll("\\bfield\\.write\\(", "field.insertText(")
        line = line.replaceAll("\\binputDragTarget\\.write\\(", "inputDragTarget.insertText(")
        // 26.x: op-level permission checks go through the PermissionSet
        line = line.replaceAll("(\\w+(?:\\.\\w+)*)\\.hasPermissionLevel\\(1\\)",
            '$1.permissions().hasPermission(net.minecraft.server.permissions.Permissions.COMMANDS_MODERATOR)')
        line = line.replaceAll("(\\w+(?:\\.\\w+)*)\\.hasPermissionLevel\\(2\\)",
            '$1.permissions().hasPermission(net.minecraft.server.permissions.Permissions.COMMANDS_GAMEMASTER)')
        line = line.replaceAll("(\\w+(?:\\.\\w+)*)\\.hasPermissionLevel\\(3\\)",
            '$1.permissions().hasPermission(net.minecraft.server.permissions.Permissions.COMMANDS_ADMIN)')
        line = line.replaceAll("(\\w+(?:\\.\\w+)*)\\.hasPermissionLevel\\(4\\)",
            '$1.permissions().hasPermission(net.minecraft.server.permissions.Permissions.COMMANDS_OWNER)')
        // 26.x: ServerPlayer lost getServer(); reach the server through the level
        line = line.replaceAll("\\b(sender|player)\\.getServer\\(\\)", '$1.level().getServer()')
        // 26.x: PlayerChatMessage.signedContent() is the plain String form
        line = line.replaceAll("(\\w+)\\.getContents\\(\\)\\.getString\\(\\)", '$1.signedContent()')
        // 26.x: SimpleSynchronousResourceReloadListener → ResourceManagerReloadListener
        line = line.replaceAll("public void reload\\(ResourceManager ", "public void onResourceManagerReload(ResourceManager ")
        // 26.x: Fabric ScreenEvents.afterRender → afterExtract
        line = line.replaceAll("ScreenEvents\\.afterRender\\(", "ScreenEvents.afterExtract(")
        // 26.x: RegistryWrapper.WrapperLookup 的工厂方法是 BuiltInRegistries.createWrapperLookup()，
        // Mojang 侧对应 RegistryAccess.fromRegistryOfRegistries(BuiltInRegistries.REGISTRY)
        line = line.replaceAll("[\\w.]*BuiltInRegistries\\.createAccess\\(\\)",
            "net.minecraft.core.RegistryAccess.fromRegistryOfRegistries(net.minecraft.core.registries.BuiltInRegistries.REGISTRY)")
        // 26.x: ChatComponent 的公开入口改名（4 参 addMessage 是私有的）
        line = line.replaceAll("\\)\\.addMessage\\((\\w+), null, null\\)", ").addPlayerMessage(\$1, null, null)")
        // 26.x: 只有继承 Screen 的屏幕重写 extractRenderState；面板类（自定义 render）由上面的
        // undo 规则保持在 render 上。屏幕声明恰好是 (…, int, int, float) + "{" 收尾的整行形式。
        line = line.replaceAll(
            "public void render\\(GuiGraphicsExtractor (\\w+), int (\\w+), int (\\w+), float (\\w+)\\) \\{",
            'public void extractRenderState(GuiGraphicsExtractor $1, int $2, int $3, float $4) {')

        // Step 5c: Post-mapping fixes (must run after Formatting→ChatFormatting and getColorValue→getColor)
        // Simplify ChatFormatting ternary: X.getColor() != null ? X.getColor() : null → X.getColor()
        line = line.replaceAll("ChatFormatting\\.(\\w+)\\.getColor\\(\\) != null \\? ChatFormatting\\.\\1\\.getColor\\(\\) : null", "ChatFormatting.\$1.getColor()")
        if (is26_2) {
            // 26.2: Minecraft.getInstance().setScreen() → Minecraft.getInstance().gui.setScreen()
            line = line.replaceAll("Minecraft\\.getInstance\\(\\)\\.setScreen\\(", "Minecraft.getInstance().gui.setScreen(")
            // 26.2: ChatFormatting.getColor() removed — replace with ChatFormatting enum directly
            line = line.replaceAll("ChatFormatting\\.([A-Z_]+)\\.getColor\\(\\)", 'ChatFormatting.$1')
            // 26.2: PlayerTeam.getColor() 变成 Optional<TeamColor>（26.1 直接返回 ChatFormatting），
            // 且 ChatFormatting 去掉了 getByName；TeamColor 的 serialized name 与枚举常量同名（仅大小写不同）
            line = line.replaceAll("ChatFormatting col = team\\.getColor\\(\\);",
                'ChatFormatting col = team.getColor().map(tc -> ChatFormatting.valueOf(tc.getSerializedName().toUpperCase(java.util.Locale.ROOT))).orElse(null);')
        }

        // Step 6: Registry static reference + inner class mappings
        line = line.replaceAll("\\bRegistry\\.", "BuiltInRegistries.")
        line = line.replaceAll("CustomPacketPayload\\.Id\\b", "CustomPacketPayload.Type")
        line = line.replaceAll("\\bId<", "Type<")
        line = line.replaceAll("ChatType\\.Parameters\\b", "ChatType.Bound")
        line = line.replaceAll("ServerboundClientCommandPacket\\.Mode\\b", "ServerboundClientCommandPacket.Action")
        line = line.replaceAll("ServerboundPlayerCommandPacket\\.Mode\\b", "ServerboundPlayerCommandPacket.Action")

        // Step 7: Fix JNI-style method descriptors (slash-separated paths in @Inject/@Invoker strings)
        line = line.replaceAll("net/minecraft/text/", "net/minecraft/network/chat/")
        line = line.replaceAll("net/minecraft/network/message/", "net/minecraft/network/chat/")
        line = line.replaceAll("net/minecraft/client/gui/hud/", "net/minecraft/client/gui/components/")
        line = line.replaceAll("net/minecraft/client/multiplayer/message/", "net/minecraft/client/multiplayer/chat/")

        return line
    }
}

def preprocessTask = tasks.register('preprocessJava', PreprocessTask) {
    srcDir = sharedSrcDir
    outDir = preprocessedDir
    targetMcVersion = mcVersion
}

sourceSets {
    main {
        java {
            setSrcDirs([])
            if (!stubOnlySources) {
                srcDir(preprocessedDir)
            }
            srcDir(versionJavaDir)
        }
        resources {
            setSrcDirs([])
            // 版本资源必须优先进入 jar，尤其是 fabric.mod.json；
            // 根目录资源作为共享补充，重复项由 duplicatesStrategy 处理。
            srcDir versionResDir
            srcDir sharedResDir
        }
    }
    test {
        java {
            setSrcDirs([])
        }
    }
}

tasks.named('compileJava').configure {
    if (!stubOnlySources) {
        dependsOn(preprocessTask)
    }
}

tasks.named('compileTestJava').configure {
    enabled = false
}

tasks.withType(Test).configureEach {
    enabled = false
}

// 本项目已经使用自定义 preprocessJava 处理 Java 源码，并通过 sourceSets 合并资源；
// 禁用 replaymod 插件自动预处理任务，避免资源重复写入 build/preprocessed 导致冲突。
tasks.matching { it.name == 'preprocessCode' || it.name == 'preprocessResources' }.configureEach {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
